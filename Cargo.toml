[workspace]
members = ["crates/raven"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
smithay = "=0.7.0"
calloop = { version = "=0.14.4", features = ["signals"] }
libc = "=0.2.189"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
